[package]
name = "sylvander-benchmark-agent"
description = "Standards-compatible benchmark adapters and trajectory evidence for Sylvander Agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sylvander-agent = { path = "../sylvander-agent" }
sylvander-llm-anthropic = { path = "../sylvander-llm-anthropic" }
sylvander-llm-core = { path = "../sylvander-llm-core" }
sylvander-llm-dashscope = { path = "../sylvander-llm-dashscope" }
sylvander-llm-openai = { path = "../sylvander-llm-openai" }
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
