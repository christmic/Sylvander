[package]
name = "sylvander-agent"
description = "Sylvander v2 provider-neutral asynchronous Agent loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sylvander-llm-core = { path = "../sylvander-llm-core" }
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
uuid = { version = "1", features = ["v4"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
sylvander-llm-anthropic = { path = "../sylvander-llm-anthropic" }
wiremock = "0.6"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "test-util", "time"] }
tempfile = "3"

[lints]
workspace = true
